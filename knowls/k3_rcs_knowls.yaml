- id: rcs.cande.k3.fq
  title: Completeness of the data on motives of K3 type over finite fields
  content: |-
    For each base field $\F_q$ in the database, the database contains every polynomial $P(T) = q + a_1T + \cdots \pm qT^{22} \in \Z[T]$ with all roots on the unit circle and geometric Picard rank at least $R(q)$, whether or not it comes from a variety.  TODO: the table of $q$ and $R(q)$.

    Some quantities have not been computed for every class: the LMFDB labels of the number fields of the transcendental part, the list of twists when there are more than $50$, Kummer candidates in characteristic $2$, polarization degrees, and candidate Néron–Severi lattices.  Realizability uses only necessary conditions.
- id: rcs.rigor.k3.fq
  title: Reliability of the data on motives of K3 type over finite fields
  content: |-
    The polynomials, their factorizations, Newton polygons, Picard ranks, Artin–Tate values, point counts and base changes are computed with exact arithmetic.  The identification of the Picard rank with the rank of the Néron–Severi group, and the Artin–Tate formula, rely on the Tate conjecture, which is a theorem for K3 surfaces over finite fields.

    The angle rank is certified when the Galois group of the transcendental part is as large as possible, and otherwise computed numerically with PARI's `lindep`, as for abelian varieties.  Twist classes are found numerically from the Frobenius angles; the minimal twist degrees $n$ are then verified by exact base change when $q^n < 2^{128}$.
