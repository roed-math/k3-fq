- id: rcs.source.k3.fq
  title: Source of the data on motives of K3 type over finite fields
  content: |-
    The polynomials were enumerated with Kedlaya's root-unitary code \cite{mr:2459990,arxiv:math/0608104}, following Kedlaya and Sutherland's work on zeta functions of K3 surfaces \cite{mr:3540942,arxiv:1511.06945}.  Polynomials with sign $-1$ are $(1 - T^2)$ times polynomials of degree $20$ with sign $+1$.  Classes of large geometric Picard rank are obtained by multiplying the transcendental parts of small degree by all cyclotomic parts of the complementary degree.

    The invariants were computed with SageMath and PARI/GP, with Magma for Galois groups that a Frobenius certificate could not determine.  Kummer candidates come from the LMFDB's isogeny classes of abelian surfaces.  The code is available at [github.com/roed-math/k3-fq](https://github.com/roed-math/k3-fq).

    The computation was done by David Roe in November 2026, with assistance from Claude Opus 5.5.
